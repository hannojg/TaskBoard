name: Check plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: npm run package
      - name: Check committed bundle matches source
        run: git diff --exit-code -- .agents/plugins/marketplace.json plugins/taskboard site/lib/board-api.mjs

  macos-companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test companion board integration
        run: swift test --package-path macos
      - name: Build app and embedded widget
        run: >-
          xcodebuild -project macos/TaskBoardFocus.xcodeproj
          -scheme TaskBoardFocus -configuration Debug
          -derivedDataPath macos/build CODE_SIGNING_ALLOWED=NO build
