<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margelo Tasks</title><meta name="description" content="A quiet place to move work forward."><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./">tasks</a><span class="private">◉ Personal workspace</span><span class="avatar">HG</span></header>
<main><div class="toolbar"><div class="view">▥ &nbsp; Board <span id="total"></span></div><div class="tools"><label class="search">⌕ <input id="search" placeholder="Search tasks…" aria-label="Search tasks"></label><div class="board-actions"><button class="primary" id="new-task">＋ New task</button><button id="add-column">＋ Add column</button></div></div></div><div id="board" class="board"></div><footer><span><span class="saved-dot"></span> <span id="save-status">Saved in this browser</span></span><span>Less noise. More progress.</span></footer></main>
<dialog id="editor"><form id="task-form"><div class="dialog-top"><span class="eyebrow">TASK DETAILS</span><button type="button" class="icon" id="close">×</button></div><label>Task name<input id="title" required maxlength="200" placeholder="What needs to get done?"></label><label>Description<textarea id="description" rows="5" placeholder="Add a little context…"></textarea></label><div class="fields"><label>Column<select id="column"></select></label><label>Priority<select id="priority"><option>None</option><option>Low</option><option>Medium</option><option>High</option></select></label></div><label>Due date<input type="date" id="due"></label><div class="dialog-actions"><button type="button" id="delete-task" class="danger">Delete task</button><button class="primary" type="submit">Save task</button></div></form></dialog>
<dialog id="column-editor"><form id="column-form"><div class="dialog-top"><span class="eyebrow">COLUMN</span><button type="button" class="icon" id="close-column">×</button></div><label>Name<input id="column-name" required maxlength="60" placeholder="e.g. In review"></label><div class="dialog-actions"><button type="button" class="danger" id="delete-column">Delete empty column</button><button class="primary">Save column</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
